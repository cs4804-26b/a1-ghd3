<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A1:Kamala </title>
</head>
<style>
  .text {
    color: whitesmoke;
    text-align: center;
  }
</style>
<body style= "background-color: #2b2b2b;">
  <div id="container"></div>
  <h1 class="text">Hello World</h1>
  <h3 class="text">This is my first time with JS, and I haven't touched html/CSS in about a decade so bear with me &#128517</h3>
  <p class="text">Look at that I managed to use an emoji! &#128513</p>
  <p class="text">And did some very basic CSS to make it dark mode &#128526</p>

  <!-- if i want to do js in a seperate file I can use src like below -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <div id="c"></div>
  <div id="r" width="500"></div>
  <div id="line"></div>
  <div id="other"></div>
  <script>
    console.log("d3 version", d3.version); // test that d3 loaded
    // Add SVGs 
    const c = d3.select("#c").append("svg")
    const r = d3.select("#r").append("svg")
    const line = d3.select("#line").append("svg")
    const other = d3.select("#other")
    //make the circle
    c.append('circle')
    .attr('cx', 100)
    .attr('cy', 100)
    .attr('r', 50)
    .attr('stroke', '#F36363')
    .attr('fill', '#F36363');
    //make the rectangle
    r.append('rect')
    .attr('height', 100)
    .attr('width', 150)
    .attr('stroke', '#8981F7')
    .attr('fill', '#6B64D8');
    //make the line
    line.append('line')
    .attr('x1', 32)
    .attr('x2', 100)
    .attr('y1', 40)
    .attr('y2', 20)
    .attr('stroke', '#8EF9A7');
    //trying to create the convex hull of these points but I don't know the attribute name to get it to work.
    const points = [[1.2223453,-3.2344],[1.3,2.33],[-2.3,-1.022],[0.22,-2.1192]]
    other.append('polygonHull')
    .attr('points', points)
    .attr('stroke', '#F3C65C');

  </script>
</body>
</html>
