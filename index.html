
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My First D3 Visualization</title>
</head>

<body>
  <h1>My First D3 Visualization</h1>
  <p>Click the sun to change its color!</p>

  <div id="container"></div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

  <script>
    // Check that D3 loaded successfully
    if (typeof d3 === "undefined") {
      document.getElementById("container").textContent =
        "Error: D3.js failed to load. Check your internet connection.";
    } else {

      console.log("D3 version:", d3.version);

      // Create SVG
      const svg = d3.select("#container").append("svg").attr("width", 600).attr("height", 400).attr("viewBox", "0 0 600 400").style("max-width", "100%").style("height", "auto").style("background", "lightblue").style("border", "2px solid black");

      // Rectangle: House
      svg.append("rect").attr("x", 200).attr("y", 180).attr("width", 200).attr("height", 170).attr("fill", "lightcoral");

      // Polygon: Roof
      svg.append("polygon").attr("points", "180,180 300,80 420,180").attr("fill", "brown");

      // Rectangle: Door
      svg.append("rect").attr("x", 275).attr("y", 270).attr("width", 50).attr("height", 80).attr("fill", "green");

      // Circle: Sun
      const sun = svg.append("circle").attr("cx", 500).attr("cy", 70).attr("r", 40).attr("fill", "yellow").style("cursor", "pointer");

      // Line: Ground
      svg.append("line").attr("x1", 0).attr("y1", 350).attr("x2", 600).attr("y2", 350).attr("stroke", "green").attr("stroke-width", 6);

      // Circle: Door Handle
      svg.append("circle").attr("cx", 315).attr("cy", 310).attr("r", 5).attr("fill", "gold");

      // Interaction: Click sun to change color
      sun.on("click", function() {
        const currentColor = sun.attr("fill");

        if (currentColor === "yellow") {
          sun.attr("fill", "orange");
        } else {
          sun.attr("fill", "yellow");
        }
      });

    }
  </script>
</body>
</html>
