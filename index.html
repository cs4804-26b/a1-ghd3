<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>A1: Hello World, GitHub and d3</title>
</head>

<body>
  <div id="container"></div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    console.log("d3 version", d3.version); // test that d3 loaded
    // Add an SVG
    const width = 700;
    const height = 400;
    const svg = d3.select("#container")
      .append("svg")
      .attr("width", width)
      .attr("height", height);

    // Add Rectangles
    svg.append("rect")
      .attr("x", 150)
      .attr("y", 150)
      .attr("width", 200)
      .attr("height", 150)
      .attr("fill", "tan")
      .attr("stroke", "black")
      .attr("stroke-width", 2);

    svg.append("rect")
      .attr("x", 225)
      .attr("y", 230)
      .attr("width", 50)
      .attr("height", 70)
      .attr("fill", "white")
      .attr("stroke", "black")
      .attr("stroke-width", 2);

    svg.append("rect")
      .attr("x", 170)
      .attr("y", 175)
      .attr("width", 40)
      .attr("height", 40)
      .attr("fill", "lightblue")
      .attr("stroke", "black")
      .attr("stroke-width", 2);

    svg.append("rect")
      .attr("x", 290)
      .attr("y", 175)
      .attr("width", 40)
      .attr("height", 40)
      .attr("fill", "lightblue")
      .attr("stroke", "black")
      .attr("stroke-width", 2);

    // Add Circles
    svg.append("circle")
      .attr("cx", 400)
      .attr("cy", 50)
      .attr("r", 25)
      .attr("fill", "red");

    // Add Lines
    svg.append("line")
      .attr("x1", 0)
      .attr("y1", 300)
      .attr("x2", 100000)
      .attr("y2", 300)
      .attr("stroke", "green")
      .attr("stroke-width", 4);

    // Add Polygons
    svg.append("polygon")
      .attr("points", "130,150 250,50 370,150")
      .attr("fill", "grey")
      .attr("stroke", "black")
      .attr("stroke-width", 2);
    svg.append("image")
      .attr("href", "DRHOUSE.jpeg")
      .attr("x", 480)
      .attr("y", 130)
      .attr("width", 180)
      .attr("height", 180)
  </script>
</body>
</html>
